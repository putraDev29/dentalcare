<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Multi-stop diagonal gradient from bottom-left (periwinkle blue) to top-right (sunny warm orange) -->
    <linearGradient id="starGradient" x1="8%" y1="92%" x2="92%" y2="8%">
      <stop offset="0%" stop-color="#7896ff" />
      <stop offset="24%" stop-color="#9874fa" />
      <stop offset="50%" stop-color="#e6548e" />
      <stop offset="76%" stop-color="#fc625c" />
      <stop offset="100%" stop-color="#ffa64c" />
    </linearGradient>

    <!-- Soft ambient shadow -->
    <filter id="softShadow" x="-15%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#6e8cff" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle rounded background -->
  <rect x="18" y="16" width="220" height="220" rx="58" fill="url(#starGradient)" filter="url(#softShadow)" />

  <!-- White Hollow Vertical-Elongated Star -->
  <path
    d="M 128 58
       C 128 88, 139 112, 145 114
       C 153 116, 167 126, 178 126
       C 167 126, 153 136, 145 138
       C 139 140, 128 164, 128 194
       C 128 164, 117 140, 111 138
       C 103 136, 89 126, 78 126
       C 89 126, 103 116, 111 114
       C 117 112, 128 88, 128 58 Z"
    fill="none"
    stroke="#ffffff"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Top-Right Plus Sign -->
  <path
    d="M 167 78 L 185 78 M 176 69 L 176 87"
    fill="none"
    stroke="#ffffff"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Bottom-Left Filled Dot -->
  <circle cx="90.5" cy="171.5" r="8.5" fill="#ffffff" />
</svg>
